<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- The same shield, inline, so the tab carries the mark with no extra
         request and no raster asset to go blurry on a HiDPI screen. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 26'%3E%3Cpath d='M12 1.6 L21 5 V13.4 L12 24.4 L3 13.4 V5 Z' fill='none' stroke='%23d6a04a' stroke-width='1.8' stroke-linejoin='round'/%3E%3Ccircle cx='12' cy='13.2' r='2.6' fill='%23d6a04a'/%3E%3C/svg%3E"
    />
    <title>Kavach — bounded revenue recovery</title>
    <meta
      name="description"
      content="An LLM recovery agent for failed payments, bounded by a deterministic policy layer. Built for the Razorpay Buildathon, Track 03."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three roles, two families. Fraunces carries the display voice: a variable
      serif with an optical-size axis and real stroke contrast, plus SOFT and
      WONK axes that take the starch out of it. IBM Plex Sans and Mono do the
      working typography, where rigidity is a feature.

      Plex Serif held the masthead first and was too upright next to Plex Mono
      -- correct, institutional, and completely still.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
