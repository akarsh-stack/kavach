    <!--
      Three roles, two families. Fraunces carries the display voice: a variable
      serif with an optical-size axis and real stroke contrast, plus SOFT and
      WONK axes that take the starch out of it. IBM Plex Sans and Mono do the
      working typography, where rigidity is a feature.

      Plex Serif held the masthead first and was too upright next to Plex Mono
      -- correct, institutional, and completely still.
    -->

      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
